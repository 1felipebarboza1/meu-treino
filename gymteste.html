<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Treino</title>

  <!-- Manifesto do Web App -->
  <link rel="manifest" href="/manifest.json">

  <!-- Configurações específicas para iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Meu Treino">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #0b1623 0%, #0d2036 50%, #122a4c 100%);
        color: #fff;
        min-height: 100%;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
    }

    .container {
        max-width: 520px;
        margin: 0 auto;
        padding: 25px;
    }

    h1 {
        text-align: center;
        background: linear-gradient(90deg, #1da1f2, #3b82f6, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(29,161,242,0.3);
        margin-bottom: 35px;
        position: relative;
    }

    h1::after {
        content: "";
        display: block;
        width: 80px;
        height: 4px;
        background: linear-gradient(90deg, #1da1f2, #3b82f6, #60a5fa);
        margin: 12px auto 0;
        border-radius: 2px;
    }

    .day {
        background: linear-gradient(135deg, #1c2b3e 0%, #223a55 100%);
        padding: 20px;
        margin: 12px 0;
        border-radius: 16px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.3s ease;
        border: 2px solid transparent;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .day:hover {
        transform: translateY(-3px);
        border-color: #3b82f6;
        box-shadow: 0 6px 25px rgba(59,130,246,0.4);
    }

    .day-name {
        font-size: 20px;
        font-weight: 600;
        color: #fff;
    }

    .day-info {
        text-align: right;
        font-size: 14px;
        color: #a0aec0;
    }

    .exercise-container {
        display: none;
    }

    .exercise-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .exercise-day-title {
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        flex: 1;
        text-align: center;
    }

    .progress-info {
        background: rgba(59,130,246,0.1);
        padding: 10px 15px;
        border-radius: 12px;
        font-size: 14px;
        color: #60a5fa;
    }

    .exercise {
        background: linear-gradient(135deg, #1c2b3e 0%, #233e5c 100%);
        margin: 12px 0;
        padding: 20px;
        border-radius: 16px;
        border: 2px solid transparent;
        transition: all 0.3s ease;
    }

    .exercise.completed {
        border-color: #4CAF50;
        background: linear-gradient(135deg, rgba(76, 175, 80, 0.15) 0%, rgba(76, 175, 80, 0.1) 100%);
    }

    .exercise-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
    }

    .exercise-name {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        flex: 1;
    }

    .exercise-details {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 10px;
    }

    .complete-checkbox {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid #3b82f6;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .complete-checkbox.checked {
        background: #4CAF50;
        border-color: #4CAF50;
    }

    .complete-checkbox.checked::after {
        content: '✓';
        color: white;
        font-weight: bold;
        font-size: 14px;
    }

    .exercise-controls {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
    }

    .control-label {
        font-size: 12px;
        color: #9ca3af;
        font-weight: 500;
    }

    .control-input {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .control-btn {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, #1da1f2 0%, #3b82f6 100%);
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
    }

    .control-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 4px 12px rgba(59,130,246,0.4);
    }

    .control-value {
        min-width: 40px;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
    }

    .back-btn {
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: #fff;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    .back-btn:hover {
        background: rgba(255,255,255,0.2);
    }

    .day-list {
        display: block;
    }

    .day-list.hidden {
        display: none;
    }

    .exercise-container.active {
        display: block;
    }

    .rest-day {
        background: linear-gradient(135deg, #2d1b69 0%, #11998e 100%);
    }

    .rest-exercise {
        background: linear-gradient(135deg, #2d1b69 0%, #11998e 100%);
        border-color: #11998e;
    }

    @media (max-width: 480px) {
        .container {
            padding: 15px;
        }
        
        .exercise-controls {
            gap: 10px;
        }
        
        .control-group {
            min-width: 70px;
        }
    }
  </style>
</head>
<body>
    <main class="container">
        <h1>💪 Meu Treino</h1>
        
        <!-- Lista de Dias da Semana -->
        <div id="dayList" class="day-list">
            <div class="day" onclick="showExercises('segunda')">
                <div class="day-name">Segunda-feira</div>
                <div class="day-info">
                    <div>PUSH - Peito, Ombro e Tríceps</div>
                    <div id="segunda-progress">0/0 exercícios</div>
                </div>
            </div>
            
            <div class="day" onclick="showExercises('terca')">
                <div class="day-name">Terça-feira</div>
                <div class="day-info">
                    <div>QUADS - Quadríceps</div>
                    <div id="terca-progress">0/0 exercícios</div>
                </div>
            </div>
            
            <div class="day rest-day" onclick="showExercises('quarta')">
                <div class="day-name">Quarta-feira</div>
                <div class="day-info">
                    <div>DESCANSO</div>
                    <div id="quarta-progress">0/0 exercícios</div>
                </div>
            </div>
            
            <div class="day" onclick="showExercises('quinta')">
                <div class="day-name">Quinta-feira</div>
                <div class="day-info">
                    <div>PULL - Costas e Bíceps</div>
                    <div id="quinta-progress">0/0 exercícios</div>
                </div>
            </div>
            
            <div class="day" onclick="showExercises('sexta')">
                <div class="day-name">Sexta-feira</div>
                <div class="day-info">
                    <div>LEGS POST - Posterior de Coxa</div>
                    <div id="sexta-progress">0/0 exercícios</div>
                </div>
            </div>
        </div>

        <!-- Container de Exercícios Dinâmico -->
        <div id="exerciseContainer" class="exercise-container">
            <div class="exercise-header">
                <button class="back-btn" onclick="backToDays()">← Voltar</button>
                <h2 id="exerciseDayTitle" class="exercise-day-title">Dia</h2>
                <div id="headerProgress" class="progress-info">0/0</div>
            </div>
            <div id="exerciseList"></div>
        </div>
    </main>

    <script>
        // Banco de dados base inicial do seu app
        const bancoInicial = {
            segunda: [
                { id: "s1", nome: "Supino Reto", series: 4, reps: 10, carga: 20, concluido: false },
                { id: "s2", nome: "Desenvolvimento Ombro", series: 3, reps: 12, carga: 12, concluido: false },
                { id: "s3", nome: "Tríceps Pulley", series: 3, reps: 15, carga: 25, concluido: false }
            ],
            terca: [
                { id: "t1", nome: "Agachamento Livre", series: 4, reps: 10, carga: 30, concluido: false },
                { id: "t2", nome: "Leg Press 45", series: 4, reps: 12, carga: 120, concluido: false },
                { id: "t3", nome: "Cadeira Extensora", series: 3, reps: 15, carga: 40, concluido: false }
            ],
            quarta: [
                { id: "q1", nome: "Cardio Leve (Caminhada)", series: 1, reps: 45, carga: 0, concluido: false, rest: true }
            ],
            quinta: [
                { id: "qi1", nome: "Puxada Alta", series: 4, reps: 10, carga: 45, concluido: false },
                { id: "qi2", nome: "Remada Baixa", series: 3, reps: 12, carga: 35, concluido: false },{ id: "qi3", nome: "Rosca Direta", series: 3, reps: 12, carga: 10, concluido: false }
],
sexta: [
{ id: "sx1", nome: "Stiff", series: 4, reps: 10, carga: 25, concluido: false },
{ id: "sx2", nome: "Cadeira Flexora", series: 4, reps: 12, carga: 35, concluido: false }
]
};
let dadosTreino = {};
let diaAtualAtivo = '';
// Carrega as informações gravadas no dispositivo ou define o banco inicial
function inicializarBancoDados() {
const dadosSalvos = localStorage.getItem('meuTreino_progresso');
if (dadosSalvos) {
dadosTreino = JSON.parse(dadosSalvos);
} else {
dadosTreino = bancoInicial;
salvarNoDispositivo();
}
atualizarTodosOsProgressosIniciais();
}
function salvarNoDispositivo() {
localStorage.setItem('meuTreino_progresso', JSON.stringify(dadosTreino));
}
function atualizarTodosOsProgressosIniciais() {
Object.keys(dadosTreino).forEach(dia => {
const total = dadosTreino[dia].length;
const concluidos = dadosTreino[dia].filter(ex => ex.concluido).length;
const el = document.getElementById(${dia}-progress);
if (el) el.innerText = ${concluidos}/${total} exercícios;
});
}
function showExercises(dia) {
diaAtualAtivo = dia;
document.getElementById('dayList').classList.add('hidden');
document.getElementById('exerciseContainer').classList.add('active');
const titulos = { segunda: "Push Day", terca: "Quads Day", quarta: "Descanso Ativo", quinta: "Pull Day", sexta: "Legs Post" };
document.getElementById('exerciseDayTitle').innerText = titulos[dia] || "Exercícios";
renderizarExerciciosDoDia();
}
function backToDays() {
document.getElementById('dayList').classList.remove('hidden');
document.getElementById('exerciseContainer').classList.remove('active');
atualizarTodosOsProgressosIniciais();
}
function renderizarExerciciosDoDia() {
const container = document.getElementById('exerciseList');
container.innerHTML = '';
const exercicios = dadosTreino[diaAtualAtivo] || [];
let concluidos = 0;
exercicios.forEach(ex => {
if (ex.concluido) concluidos++;
const classeRest = ex.rest ? 'rest-exercise' : '';
const classeCheck = ex.concluido ? 'checked' : '';
const classeCardConcluido = ex.concluido ? 'completed' : '';
container.innerHTML += `


${ex.nome}

Séries

-
${ex.series}
+

Reps

-
${ex.reps}
+

${ex.rest ? 'Minutos' : 'Carga (kg)'}

-
${ex.carga}
+




`;
});
document.getElementById('headerProgress').innerText = ${concluidos}/${exercicios.length};
}
function alterarValor(id, campo, alteracao) {
const exercicio = dadosTreino[diaAtualAtivo].find(ex => ex.id === id);
if (exercicio) {
exercicio[campo] = Math.max(0, exercicio[campo] + alteracao);
salvarNoDispositivo();
renderizarExerciciosDoDia();
}
}
function alternarConclusao(id) {
const exercicio = dadosTreino[diaAtualAtivo].find(ex => ex.id === id);
if (exercicio) {
exercicio.concluido = !exercicio.concluido;
salvarNoDispositivo();
renderizarExerciciosDoDia();
}
}
// Executa automaticamente ao abrir o App
window.onload = inicializarBancoDados;
